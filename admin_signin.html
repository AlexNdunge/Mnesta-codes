<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In - JuaKazi</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-900 via-blue-800 to-blue-600 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <div class="bg-white rounded-full p-4 shadow-lg">
        <i class="fas fa-user-shield text-4xl text-blue-600"></i>
      </div>
    </div>
    <h2 class="mt-6 text-center text-3xl font-extrabold text-white">
      Admin Portal
    </h2>
    <p class="mt-2 text-center text-sm text-blue-100">
      Enter the 4-digit admin PIN to continue
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow-2xl sm:rounded-lg sm:px-10">
        <!-- Security Badge -->
        <div class="flex items-center justify-center space-x-2 text-sm text-gray-600 bg-green-50 border border-green-200 rounded-md p-3 mb-6">
          <i class="fas fa-shield-alt text-green-600"></i>
          <span class="font-medium">Secure Admin Login - Protected Access</span>
        </div>

        <form class="space-y-6" id="adminLoginForm" novalidate>
        <div>
          <label class="block text-sm font-medium text-gray-700 text-center mb-3">
            <i class="fas fa-lock mr-1"></i> Admin PIN
          </label>
          <div class="flex justify-center gap-3">
            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off"
              class="pin-digit w-14 h-14 text-center text-2xl border border-gray-300 rounded-md
              focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off"
              class="pin-digit w-14 h-14 text-center text-2xl border border-gray-300 rounded-md
              focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off"
              class="pin-digit w-14 h-14 text-center text-2xl border border-gray-300 rounded-md
              focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off"
              class="pin-digit w-14 h-14 text-center text-2xl border border-gray-300 rounded-md
              focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>
          <p id="pinError" class="mt-3 text-center text-sm text-red-600 hidden"></p>
        </div>

        <div>
          <button type="submit"
            class="w-full flex justify-center items-center py-3 px-4 border border-transparent 
            text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 
            focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
            <i class="fas fa-unlock mr-2"></i>
            Unlock Admin Panel
          </button>
        </div>
      </form>

      <div class="mt-6">
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-300"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-gray-500">
              <i class="fas fa-info-circle"></i> Admin access only
            </span>
          </div>
        </div>
      </div>

      <div class="mt-6 text-center">
        <a href="index.html" class="text-sm text-blue-600 hover:text-blue-500">
          <i class="fas fa-arrow-left mr-1"></i> Back to main site
        </a>
      </div>
    </div>

    <!-- Security Notice -->
    <div class="mt-6 bg-blue-900 bg-opacity-50 rounded-lg p-4 text-center">
      <p class="text-xs text-blue-100">
        <i class="fas fa-lock mr-1"></i>
        This area is restricted to authorized administrators only. 
        All login attempts are monitored and logged.
      </p>
    </div>
  </div>

  <script>
    (function () {
      const inputs = Array.from(document.querySelectorAll('.pin-digit'));
      const form = document.getElementById('adminLoginForm');
      const errorEl = document.getElementById('pinError');

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.remove('hidden');
      }
      function clearError() {
        errorEl.classList.add('hidden');
      }
      function resetInputs() {
        inputs.forEach((el) => { el.value = ''; });
        inputs[0].focus();
      }

      inputs.forEach((input, index) => {
        input.addEventListener('input', () => {
          input.value = input.value.replace(/[^0-9]/g, '').slice(0, 1);
          if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        // Lets someone paste a PIN from a password manager instead of
        // typing each digit into its own box.
        input.addEventListener('paste', (e) => {
          const text = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
          if (!text) return;
          e.preventDefault();
          text.slice(0, inputs.length).split('').forEach((digit, i) => {
            if (inputs[i]) inputs[i].value = digit;
          });
          const next = inputs[Math.min(text.length, inputs.length - 1)];
          if (next) next.focus();
        });
      });

      inputs[0].focus();

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearError();

        const pin = inputs.map((el) => el.value).join('');
        if (pin.length !== 4) {
          showError('Enter all 4 digits.');
          resetInputs();
          return;
        }

        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin })
          });

          const data = await response.json();

          if (!response.ok) {
            showError(data.message || 'Login failed. Please try again.');
            resetInputs();
            return;
          }

          // Auth works via the httpOnly cookie the server just set — no
          // need to also stash anything in localStorage.
          window.location.href = 'admin-dashboard.html';
        } catch (error) {
          console.error('Error:', error);
          showError('An error occurred. Please try again.');
          resetInputs();
        }
      });
    })();
  </script>
</body>
</html>
